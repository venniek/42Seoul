version: "3.5"

networks:
  my-network:
    name: my-network
    driver: bridge

volumes:
  wp:
    driver: local
    name: wp
    driver_opts:
      type: none
      o: bind
      # device: /home/naykim/data/wordpress
      device: /Users/nayeon/Desktop/naykim/data/wordpress
  db:
    driver: local
    name: db
    driver_opts:
      type: none
      o: bind
      # device: /home/naykim/data/mariadb
      device: /Users/nayeon/Desktop/naykim/data/mariadb

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file:
      - ./.env
    volumes:
      - db:/var/lib/mysql
    networks:
      - my-network
    restart: unless-stopped

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    env_file:
      - ./.env
    depends_on:
      - mariadb
    volumes:
      - wp:/var/www/html
    networks:
      - my-network
    restart: unless-stopped

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - 443:443
    depends_on:
      - wordpress
    volumes:
      - wp:/var/www/html
    networks:
      - my-network
    restart: unless-stopped